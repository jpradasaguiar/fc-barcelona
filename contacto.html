<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contacto - Mi Sitio Web</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .container {
            background: #ffffff;
            border-radius: 20px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            max-width: 900px;
            width: 100%;
            overflow: hidden;
            display: grid;
            grid-template-columns: 1fr 1.5fr;
        }

        .info-section {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 50px 40px;
            display: flex;
            flex-direction: column;
            justify-content: center;
        }

        .info-section h2 {
            font-size: 2rem;
            margin-bottom: 20px;
        }

        .info-section p {
            line-height: 1.6;
            margin-bottom: 30px;
            opacity: 0.95;
        }

        .info-item {
            display: flex;
            align-items: center;
            margin-bottom: 20px;
        }

        .info-item .icon {
            font-size: 1.5rem;
            margin-right: 15px;
        }

        .form-section {
            padding: 50px 40px;
        }

        .form-section h1 {
            color: #333;
            margin-bottom: 10px;
            font-size: 1.8rem;
        }

        .form-section .subtitle {
            color: #777;
            margin-bottom: 30px;
            font-size: 0.95rem;
        }

        .form-group {
            margin-bottom: 20px;
        }

        .form-group label {
            display: block;
            color: #555;
            margin-bottom: 8px;
            font-weight: 600;
            font-size: 0.9rem;
        }

        .form-group input,
        .form-group textarea {
            width: 100%;
            padding: 12px 15px;
            border: 2px solid #e0e0e0;
            border-radius: 10px;
            font-size: 1rem;
            transition: border-color 0.3s, box-shadow 0.3s;
            outline: none;
        }

        .form-group input:focus,
        .form-group textarea:focus {
            border-color: #667eea;
            box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.15);
        }

        .form-group textarea {
            resize: vertical;
            min-height: 120px;
        }

        button {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            padding: 14px 30px;
            border-radius: 10px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            width: 100%;
            transition: transform 0.2s, box-shadow 0.2s;
        }

        button:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 20px rgba(102, 126, 234, 0.4);
        }

        button:active {
            transform: translateY(0);
        }

        @media (max-width: 768px) {
            .container {
                grid-template-columns: 1fr;
            }
            .info-section {
                padding: 40px 30px;
            }
            .form-section {
                padding: 40px 30px;
            }
        }
    </style>
</head>
<body>

    <div class="container">
        <!-- Sección de información -->
        <div class="info-section">
            <h2>¡Hablemos!</h2>
            <p>¿Tienes alguna pregunta, propuesta o simplemente quieres saludar? Estamos aquí para ayudarte.</p>

            <div class="info-item">
                <span class="icon">📧</span>
                <span>jpradasaguiar@gmail.com</span>
            </div>
            <div class="info-item">
                <span class="icon">📱</span>
                <span>+535 5652846</span>
            </div>
            <div class="info-item">
                <span class="icon">📍</span>
                <span>La Habana, Cuba</span>
            </div>
        </div>

        <!-- Formulario de contacto -->
        <div class="form-section">
            <h1>Formulario de Contacto</h1>
            <p class="subtitle">Rellena los campos y nos pondremos en contacto contigo.</p>

            <form action="#" method="POST" onsubmit="enviarFormulario(event)">
                <div class="form-group">
                    <label for="nombre">Nombre completo</label>
                    <input type="text" id="nombre" name="nombre" placeholder="Tu nombre" required>
                </div>

                <div class="form-group">
                    <label for="email">Correo electrónico</label>
                    <input type="email" id="email" name="email" placeholder="tucorreo@ejemplo.com" required>
                </div>

                <div class="form-group">
                    <label for="asunto">Asunto</label>
                    <input type="text" id="asunto" name="asunto" placeholder="¿En qué podemos ayudarte?" required>
                </div>

                <div class="form-group">
                    <label for="mensaje">Mensaje</label>
                    <textarea id="mensaje" name="mensaje" placeholder="Escribe tu mensaje aquí..." required></textarea>
                </div>

                <button type="submit">Enviar Mensaje ✉️</button>
            </form>
        </div>
    </div>

    <script>
        function enviarFormulario(event) {
            event.preventDefault();
            const nombre = document.getElementById('nombre').value;
            alert(`¡Gracias, ${nombre}! Tu mensaje ha sido enviado correctamente.`);
            event.target.reset();
        }
    </script>

</body>
</html>
